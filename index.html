    <!-- Clear expired Supabase auth tokens on every page load.
         Stale tokens in Chrome's localStorage cause auth.getSession() to hang,
         which blocks the app from rendering and freezes the sign-in button.
         CRITICAL: never touches keys starting with 'artwork_' (artwork cache). -->
    <script>
      try {
        Object.keys(localStorage)
          .filter(function(k) { return k.startsWith('sb-') && k.includes('auth'); })
          .forEach(function(key) {
            try {
              var val = JSON.parse(localStorage.getItem(key));
              if (!val || (val.expires_at && val.expires_at * 1000 < Date.now())) {
                localStorage.removeItem(key);
              }
            } catch(e) {
              localStorage.removeItem(key);
            }
          });
      } catch(e) {}
    </script>

    <script>
      if ('serviceWorker' in navigator) {
        // Unregister any existing service workers first so the fresh SW
        // takes effect immediately without waiting for the old one to expire.
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          registrations.forEach(function(reg) { reg.unregister(); });
        });
        // Register the network-first service worker after page load
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .catch(function(err) { console.warn('SW registration failed:', err); });
        });
